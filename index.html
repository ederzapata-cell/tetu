<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>Smart Metronome V2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{
      --bg:#0d0f13;--panel:#151922;--panel2:#1c2230;--text:#f5f7fb;--muted:#9aa6b6;
      --accent:#53a8ff;--accent2:#8ad4ff;--danger:#ff6b6b;--border:rgba(255,255,255,.08);
      --shadow:0 18px 60px rgba(0,0,0,.35)
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;color:var(--text);
      background:radial-gradient(circle at top,rgba(83,168,255,.12),transparent 34rem),var(--bg);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:980px;margin:auto;padding:22px 16px 42px}
    .topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
    .brand h1{font-size:clamp(1.2rem,3vw,1.6rem);margin:0}
    .brand p{margin:.25rem 0 0;color:var(--muted);font-size:.9rem}
    .status{font-size:.8rem;color:var(--muted);border:1px solid var(--border);padding:7px 10px;border-radius:999px}
    .grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:16px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}
    .main{padding:22px}.side{padding:18px;display:flex;flex-direction:column;gap:14px}
    .visual{
      width:min(76vw,340px);aspect-ratio:1;margin:4px auto 18px;border-radius:50%;display:grid;place-items:center;
      background:radial-gradient(circle,rgba(83,168,255,.12),rgba(83,168,255,.025) 50%,transparent 70%);
      position:relative;transition:transform .07s ease,background .07s ease,box-shadow .07s ease
    }
    .visual::before{content:"";position:absolute;inset:12%;border:2px solid rgba(255,255,255,.08);border-radius:50%}
    .visual.pulse{transform:scale(1.055);box-shadow:0 0 80px rgba(83,168,255,.38);background:radial-gradient(circle,rgba(83,168,255,.48),rgba(83,168,255,.08) 56%,transparent 72%)}
    .visual.accent{box-shadow:0 0 100px rgba(138,212,255,.7);background:radial-gradient(circle,rgba(138,212,255,.7),rgba(83,168,255,.12) 58%,transparent 72%)}
    .bpm-wrap{text-align:center;position:relative;z-index:1}
    #bpmDisplay{font-size:clamp(4.8rem,18vw,8rem);font-weight:800;line-height:.85;letter-spacing:-.06em}
    .bpm-label{color:var(--muted);letter-spacing:.16em;font-size:.8rem;margin-top:12px}
    .beat-count{margin-top:10px;color:var(--accent2);font-weight:700}
    .bpm-controls{display:grid;grid-template-columns:58px 1fr 58px;gap:10px;align-items:center;margin:10px 0 14px}
    .square,.primary,.ghost,.mode button{border:1px solid var(--border);color:var(--text);background:var(--panel2);border-radius:16px;min-height:50px}
    .square{font-size:1.4rem}
    input[type=range]{width:100%;accent-color:var(--accent)}
    .main-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .primary{background:linear-gradient(180deg,#60b3ff,#378ee3);color:#07121e;font-weight:800;border:0}
    .primary.stop{background:linear-gradient(180deg,#ff8585,#ed5959);color:#251010}
    .ghost{font-weight:700}
    .mode{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .mode button{min-height:42px;font-size:.85rem}.mode button.active{outline:2px solid var(--accent);background:rgba(83,168,255,.14)}
    .section{border-top:1px solid var(--border);padding-top:14px}.section:first-child{border-top:0;padding-top:0}
    .section h2{font-size:.95rem;margin:0 0 10px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.78rem}
    select,input[type=number]{width:100%;border:1px solid var(--border);background:#10141c;color:var(--text);border-radius:12px;padding:10px 11px;min-height:42px}
    .check{flex-direction:row;align-items:center;gap:8px;margin-top:8px}
    .session-status{background:#10141c;border:1px solid var(--border);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:.82rem;line-height:1.45}
    .session-status strong{color:var(--text)}
    .mini{font-size:.74rem;color:var(--muted);margin-top:6px}
    .footer{margin-top:14px;text-align:center;color:var(--muted);font-size:.73rem}
    .flash-layer{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:99;transition:opacity .08s ease;background:rgba(83,168,255,.45)}
    .flash-layer.on{opacity:1}.flash-layer.accent{background:rgba(138,212,255,.65)}

    .volume-line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:10px}
    .volume-line output{min-width:44px;text-align:right;color:var(--accent2);font-weight:700;font-size:.8rem}
    .countdown{
      position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;
      font-size:clamp(4.5rem,18vw,8.5rem);font-weight:900;letter-spacing:-.05em;
      color:var(--text);text-shadow:0 8px 40px rgba(0,0,0,.55);opacity:0;transform:scale(.92);
      transition:opacity .12s ease,transform .12s ease
    }
    .countdown.show{opacity:1;transform:scale(1)}
    .countdown small{display:block;font-size:.14em;letter-spacing:.12em;text-align:center;color:var(--accent2);margin-top:8px}
    .segmented{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
    .segmented button{border:1px solid var(--border);color:var(--text);background:#10141c;border-radius:12px;min-height:40px;font-size:.8rem}
    .segmented button.active{outline:2px solid var(--accent);background:rgba(83,168,255,.14)}

    @media(max-width:760px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.status{display:none}.visual{width:min(78vw,315px)}}
  </style>
</head>
<body>
<div id="flashLayer" class="flash-layer"></div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>Smart Metronome <span style="color:var(--accent)">V2</span></h1>
      <p>Simple por fuera. Potente por dentro.</p>
    </div>
    <div class="status" id="offlineStatus">Offline ready</div>
  </div>

  <div class="grid">
    <section class="card main">
      <div id="visual" class="visual">
        <div id="countdown" class="countdown"></div>
        <div class="bpm-wrap">
          <div id="bpmDisplay">80</div>
          <div class="bpm-label">BPM</div>
          <div class="beat-count" id="beatCount">1 / 4</div>
        </div>
      </div>

      <div class="bpm-controls">
        <button class="square" id="minusBtn">−</button>
        <input id="bpmSlider" type="range" min="30" max="240" value="80">
        <button class="square" id="plusBtn">+</button>
      </div>

      <div class="main-actions">
        <button class="primary" id="startBtn">Start</button>
        <button class="ghost" id="tapBtn">Tap Tempo</button>
      </div>
    </section>

    <aside class="card side">
      <div class="section">
        <h2>Output</h2>
        <div class="mode">
          <button data-mode="sound">Sound</button>
          <button data-mode="visual">Visual</button>
          <button data-mode="both" class="active">Both</button>
        </div>
        <label class="check"><input id="fullscreenFlash" type="checkbox"> Full-screen flash</label>
      </div>

      <div class="section">
        <h2>Meter & Sound</h2>
        <div class="row">
          <label>Time signature
            <select id="meter">
              <option value="2">2/4</option>
              <option value="3">3/4</option>
              <option value="4" selected>4/4</option>
              <option value="5">5/4</option>
              <option value="6">6/8</option>
              <option value="7">7/8</option>
            </select>
          </label>
          <label>Sound
            <select id="soundType">
              <option value="soft">Soft Click</option>
              <option value="wood">Wood</option>
              <option value="clap">Clap</option>
              <option value="hat">Hi-Hat</option>
            </select>
          </label>
        </div>
        <label class="check"><input id="accentFirst" type="checkbox" checked> Accent first beat</label>
        <div class="volume-line">
          <label style="width:100%">Volume
            <input id="volume" type="range" min="0" max="100" value="70">
          </label>
          <output id="volumeValue">70%</output>
        </div>
      </div>

      <div class="section">
        <h2>Practice Session</h2>
        <div class="row">
          <label>Duration (min)
            <input id="durationMin" type="number" min="0" max="180" step="0.5" value="1">
          </label>
          <label>Count-in
            <select id="countInBars">
              <option value="0">None</option>
              <option value="1">1 bar</option>
              <option value="2">2 bars</option>
              <option value="4">4 bars</option>
            </select>
          </label>
        </div>

        <div class="row" style="margin-top:9px">
          <label>Increase BPM
            <input id="increaseBpm" type="number" min="-50" max="50" value="5">
          </label>
          <label>Target BPM
            <input id="maxBpm" type="number" min="30" max="400" value="120">
          </label>
        </div>

        <div class="segmented">
          <button id="bySecondsBtn" class="active" type="button">Every seconds</button>
          <button id="byBarsBtn" type="button">Every bars</button>
        </div>

        <div class="row" style="margin-top:9px">
          <label id="secondsLabel">Every (sec)
            <input id="increaseEvery" type="number" min="1" max="3600" value="20">
          </label>
          <label id="barsLabel" style="display:none">Every (bars)
            <input id="increaseEveryBars" type="number" min="1" max="999" value="8">
          </label>
          <label>Countdown
            <select id="countdownMode">
              <option value="remaining" selected>Time remaining</option>
              <option value="off">Off</option>
            </select>
          </label>
        </div>

        <label class="check"><input id="sessionEnabled" type="checkbox"> Enable programmed session</label>
      </div>

      <div class="session-status" id="sessionStatus">
        <strong>Ready.</strong><br>
        Start at 80 BPM.
      </div>
      <div class="mini">Tip: press Space to start/stop. Tap Tempo works with mouse or touch.</div>
    </aside>
  </div>

  <div class="footer">Smart Metronome V2 · Offline-first practice tool</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const bpmDisplay = $('bpmDisplay');
  const bpmSlider = $('bpmSlider');
  const beatCount = $('beatCount');
  const visual = $('visual');
  const startBtn = $('startBtn');
  const tapBtn = $('tapBtn');
  const meter = $('meter');
  const soundType = $('soundType');
  const accentFirst = $('accentFirst');
  const volume = $('volume');
  const volumeValue = $('volumeValue');
  const countdown = $('countdown');
  const countInBars = $('countInBars');
  const fullscreenFlash = $('fullscreenFlash');
  const flashLayer = $('flashLayer');
  const sessionEnabled = $('sessionEnabled');
  const durationMin = $('durationMin');
  const increaseBpm = $('increaseBpm');
  const increaseEvery = $('increaseEvery');
  const increaseEveryBars = $('increaseEveryBars');
  const maxBpm = $('maxBpm');
  const countdownMode = $('countdownMode');
  const bySecondsBtn = $('bySecondsBtn');
  const byBarsBtn = $('byBarsBtn');
  const secondsLabel = $('secondsLabel');
  const barsLabel = $('barsLabel');
  const sessionStatus = $('sessionStatus');

  let bpm = 80;
  let isRunning = false;
  let currentBeat = 0;
  let mode = 'both';
  let audioCtx = null;
  let nextNoteTime = 0;
  let schedulerTimer = null;
  let sessionStart = 0;
  let nextIncreaseAt = 0;
  let nextIncreaseBar = 0;
  let completedBars = 0;
  let progressionUnit = 'seconds';
  let countInRemainingBeats = 0;
  let sessionClockStarted = false;
  let tapTimes = [];
  const lookahead = 25;
  const scheduleAheadTime = 0.12;

  function setBpm(value) {
    bpm = Math.max(30, Math.min(400, Math.round(Number(value))));
    bpmDisplay.textContent = bpm;
    bpmSlider.value = Math.min(240, bpm);
    updateSessionText();
  }

  function updateSessionText(extra='') {
    if (!isRunning) {
      sessionStatus.innerHTML = `<strong>Ready.</strong><br>Start at ${bpm} BPM.${extra ? '<br>'+extra : ''}`;
      return;
    }
    const elapsed = (performance.now() - sessionStart) / 1000;
    const total = Math.max(0, Number(durationMin.value) * 60);
    const remaining = total > 0 ? Math.max(0, total - elapsed) : 0;
    sessionStatus.innerHTML = `<strong>Running · ${bpm} BPM</strong><br>${total > 0 ? `Remaining: ${Math.ceil(remaining)} sec` : 'Open session'}${extra ? '<br>'+extra : ''}`;
  }

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function masterVolume(mult=1) {
    return Math.max(0, Math.min(1, Number(volume.value) / 100)) * mult;
  }

  function toneAt(time, accent=false) {
    if (mode === 'visual') return;
    ensureAudio();
    const type = soundType.value;

    if (type === 'clap') {
      const bufferSize = Math.floor(audioCtx.sampleRate * 0.05);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(bufferSize/5));
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = accent ? 1500 : 1200;
      filter.Q.value = 0.8;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(masterVolume(accent ? 0.45 : 0.28), time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
      src.connect(filter).connect(gain).connect(audioCtx.destination);
      src.start(time); src.stop(time + 0.07);
      return;
    }

    if (type === 'hat') {
      const bufferSize = Math.floor(audioCtx.sampleRate * 0.035);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 6500;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(masterVolume(accent ? 0.24 : 0.13), time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
      src.connect(filter).connect(gain).connect(audioCtx.destination);
      src.start(time); src.stop(time + 0.04);
      return;
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type === 'wood' ? 'triangle' : 'sine';
    osc.frequency.setValueAtTime(
      type === 'wood' ? (accent ? 650 : 500) : (accent ? 420 : 320), time
    );
    gain.gain.setValueAtTime(masterVolume(type === 'wood' ? (accent ? 0.38 : 0.25) : (accent ? 0.30 : 0.18)), time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + (type === 'wood' ? 0.05 : 0.075));
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(time); osc.stop(time + 0.08);
  }

  function visualBeat(beat, accent) {
    if (mode === 'sound') return;
    beatCount.textContent = `${beat + 1} / ${meter.value}`;
    visual.classList.remove('pulse','accent');
    void visual.offsetWidth;
    visual.classList.add(accent ? 'accent' : 'pulse');
    setTimeout(() => visual.classList.remove('pulse','accent'), Math.min(110, 60000/bpm*0.35));

    if (fullscreenFlash.checked) {
      flashLayer.className = 'flash-layer on' + (accent ? ' accent' : '');
      setTimeout(() => flashLayer.className = 'flash-layer', Math.min(90, 60000/bpm*0.25));
    }
  }

  function scheduleNote(beat, time) {
    const accent = accentFirst.checked && beat === 0;
    const inCountIn = countInRemainingBeats > 0;

    toneAt(time, accent);
    const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);

    setTimeout(() => {
      if (inCountIn) {
        const beatsPerBar = Number(meter.value);
        const beatNumber = beatsPerBar - ((countInRemainingBeats - 1) % beatsPerBar);
        countdown.innerHTML = `${beatNumber}<small>COUNT IN</small>`;
        countdown.classList.add('show');
        visualBeat(beat, accent);
        countInRemainingBeats--;

        if (countInRemainingBeats <= 0) {
          setTimeout(() => countdown.classList.remove('show'), 150);
          sessionStart = performance.now();
          sessionClockStarted = true;
          nextIncreaseAt = Math.max(1, Number(increaseEvery.value));
          nextIncreaseBar = Math.max(1, Number(increaseEveryBars.value));
          completedBars = 0;
        }
      } else {
        visualBeat(beat, accent);
        if (beat === 0 && sessionClockStarted) completedBars++;
      }
    }, delay);
  }

  function nextNote() {
    const secondsPerBeat = 60 / bpm;
    nextNoteTime += secondsPerBeat;
    currentBeat = (currentBeat + 1) % Number(meter.value);
  }

  function scheduler() {
    if (!isRunning) return;
    ensureAudio();
    while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
      scheduleNote(currentBeat, nextNoteTime);
      nextNote();
    }
    checkSession();
  }

  function checkSession() {
    if (!isRunning || !sessionEnabled.checked || !sessionClockStarted) return;

    const now = performance.now();
    const elapsed = (now - sessionStart) / 1000;
    const total = Math.max(0, Number(durationMin.value) * 60);

    if (total > 0 && elapsed >= total) {
      const finishedAt = bpm;
      stop();
      sessionStatus.innerHTML = `<strong>Session complete.</strong><br>Finished at ${finishedAt} BPM.`;
      countdown.innerHTML = `✓<small>DONE</small>`;
      countdown.classList.add('show');
      setTimeout(() => countdown.classList.remove('show'), 1200);
      return;
    }

    const inc = Number(increaseBpm.value);
    const limit = Number(maxBpm.value);
    const shouldIncrease =
      progressionUnit === 'seconds'
        ? elapsed >= nextIncreaseAt
        : completedBars >= nextIncreaseBar;

    if (shouldIncrease) {
      const candidate = bpm + inc;
      if ((inc > 0 && candidate <= limit) || (inc < 0 && candidate >= limit)) {
        setBpm(candidate);
      } else if ((inc > 0 && bpm < limit) || (inc < 0 && bpm > limit)) {
        setBpm(limit);
      }

      if (progressionUnit === 'seconds') {
        nextIncreaseAt += Math.max(1, Number(increaseEvery.value));
      } else {
        nextIncreaseBar += Math.max(1, Number(increaseEveryBars.value));
      }
    }

    if (countdownMode.value === 'remaining' && total > 0) {
      const remaining = Math.max(0, total - elapsed);
      const whole = Math.ceil(remaining);
      const mins = Math.floor(whole / 60);
      const secs = whole % 60;
      countdown.innerHTML = `${mins}:${String(secs).padStart(2,'0')}<small>REMAINING</small>`;
      countdown.classList.add('show');
    } else if (countInRemainingBeats <= 0) {
      countdown.classList.remove('show');
    }

    updateSessionText(progressionUnit === 'bars' ? `Bars: ${completedBars}` : '');
  }

  function start() {
    if (isRunning) return;
    ensureAudio();
    isRunning = true;
    currentBeat = 0;
    nextNoteTime = audioCtx.currentTime + 0.06;
    completedBars = 0;

    const bars = Math.max(0, Number(countInBars.value));
    countInRemainingBeats = bars * Number(meter.value);
    sessionClockStarted = countInRemainingBeats === 0;

    if (sessionClockStarted) {
      sessionStart = performance.now();
      nextIncreaseAt = Math.max(1, Number(increaseEvery.value));
      nextIncreaseBar = Math.max(1, Number(increaseEveryBars.value));
    }

    schedulerTimer = setInterval(scheduler, lookahead);
    startBtn.textContent = 'Stop';
    startBtn.classList.add('stop');
    scheduler();
  }

  function stop() {
    isRunning = false;
    if (schedulerTimer) clearInterval(schedulerTimer);
    schedulerTimer = null;
    startBtn.textContent = 'Start';
    startBtn.classList.remove('stop');
    currentBeat = 0;
    countInRemainingBeats = 0;
    sessionClockStarted = false;
    completedBars = 0;
    countdown.classList.remove('show');
    beatCount.textContent = `1 / ${meter.value}`;
    visual.classList.remove('pulse','accent');
    flashLayer.className = 'flash-layer';
    updateSessionText();
  }

  function tapTempo() {
    const now = performance.now();
    if (tapTimes.length && now - tapTimes[tapTimes.length-1] > 2000) tapTimes = [];
    tapTimes.push(now);
    if (tapTimes.length > 6) tapTimes.shift();
    if (tapTimes.length >= 2) {
      const intervals = [];
      for (let i=1;i<tapTimes.length;i++) intervals.push(tapTimes[i]-tapTimes[i-1]);
      const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
      setBpm(60000/avg);
    }
  }

  $('minusBtn').onclick = () => setBpm(bpm-1);
  $('plusBtn').onclick = () => setBpm(bpm+1);
  bpmSlider.oninput = e => setBpm(e.target.value);
  startBtn.onclick = () => isRunning ? stop() : start();
  tapBtn.onclick = tapTempo;
  meter.onchange = () => { currentBeat=0; beatCount.textContent = `1 / ${meter.value}`; };

  volume.oninput = () => {
    volumeValue.value = `${volume.value}%`;
    localStorage.setItem('smartMetronomeVolume', volume.value);
  };

  bySecondsBtn.onclick = () => {
    progressionUnit = 'seconds';
    bySecondsBtn.classList.add('active');
    byBarsBtn.classList.remove('active');
    secondsLabel.style.display = 'flex';
    barsLabel.style.display = 'none';
  };

  byBarsBtn.onclick = () => {
    progressionUnit = 'bars';
    byBarsBtn.classList.add('active');
    bySecondsBtn.classList.remove('active');
    barsLabel.style.display = 'flex';
    secondsLabel.style.display = 'none';
  };


  document.querySelectorAll('.mode button').forEach(btn => {
    btn.onclick = () => {
      mode = btn.dataset.mode;
      document.querySelectorAll('.mode button').forEach(b => b.classList.toggle('active', b === btn));
    };
  });

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      isRunning ? stop() : start();
    }
  });

  window.addEventListener('online', () => $('offlineStatus').textContent = 'Online');
  window.addEventListener('offline', () => $('offlineStatus').textContent = 'Offline ready');
  $('offlineStatus').textContent = navigator.onLine ? 'Online · offline capable' : 'Offline ready';

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }

  const savedVolume = localStorage.getItem('smartMetronomeVolume');
  if (savedVolume !== null) {
    volume.value = savedVolume;
    volumeValue.value = `${savedVolume}%`;
  }

  setBpm(80);
})();
</script>
</body>
</html>
